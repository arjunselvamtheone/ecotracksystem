<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EcoTrack — Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav>
      <h1>E C O T R A C K</h1>
      <div class="links">
        <a href="index.html" class="active">Login</a>
        <a href="signup.html">Sign up</a>
      </div>
    </nav>

    <main class="page">
      <div class="card" style="max-width: 480px; margin: 0 auto">
        <h2>Welcome back</h2>
        <p class="muted">Use demo credentials to continue</p>
        <div class="space"></div>
        <form id="loginForm">
          <div class="form-row">
            <label>Email</label>
            <input
              name="email"
              type="email"
              placeholder="demo@ecotrack.org"
              required
            />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input
              name="password"
              type="password"
              placeholder="demo1234"
              required
            />
          </div>
          <div class="stack">
            <button class="btn primary" type="submit">Sign in</button>
            <a class="btn ghost" href="signup.html">Create account</a>
          </div>
          <div id="loginMsg" class="muted" style="margin-top: 10px"></div>
        </form>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
