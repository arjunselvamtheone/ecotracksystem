<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EcoTrack — Sign up</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav>
      <h1>E C O T R A C K</h1>
      <div class="links">
        <a href="index.html">Login</a>
        <a href="signup.html" class="active">Sign up</a>
      </div>
    </nav>

    <main class="page">
      <div class="card" style="max-width: 520px; margin: 0 auto">
        <h2>Create your account</h2>
        <div class="space"></div>
        <form id="signupForm">
          <div class="form-row">
            <label>First name</label>
            <input id="firstName" name="firstName" required />
          </div>
          <div class="form-row">
            <label>Last name</label>
            <input id="lastName" name="lastName" required />
          </div>
          <div class="form-row">
            <label>Email</label>
            <input id="signupEmail" name="email" type="email" required />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input
              id="signupPassword"
              name="password"
              type="password"
              minlength="8"
              required
            />
          </div>
          <div class="stack">
            <button class="btn primary" type="submit">Create account</button>
            <a class="btn ghost" href="index.html">Already have an account?</a>
          </div>
          <div id="signupMsg" class="muted" style="margin-top: 10px"></div>
        </form>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
