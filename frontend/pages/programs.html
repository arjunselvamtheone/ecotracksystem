<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EcoTrack — Programs</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav>
      <h1>E C O T R A C K</h1>
      <div class="links">
        <a href="../dashboard.html">Dashboard</a>
        <a href="animals.html">Animals</a>
        <a href="habitats.html">Habitats</a>
        <a href="species.html">Species</a>
        <a class="active" href="programs.html">Programs</a>
        <a href="incidents.html">Incidents</a>
      </div>
    </nav>

    <main class="page">
      <div class="card">
        <div class="stack">
          <h2>Conservation Programs</h2>
          <button id="newProgram" class="btn primary">+ New Program</button>
        </div>
        <div class="space"></div>

        <table class="table" id="programTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Habitat</th>
              <th>Start</th>
              <th>Status</th>
              <th>Funding %</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <!-- Add Program Modal -->
    <div id="programModal" class="modal">
      <div class="modal-content">
        <h3>Add Program</h3>
        <div class="form-row"><label>Name</label><input id="p_name" /></div>
        <div class="form-row">
          <label>Habitat ID</label><input id="p_habitat" type="number" />
        </div>
        <div class="form-row">
          <label>Start</label><input id="p_start" type="date" />
        </div>
        <div class="form-row">
          <label>Status</label>
          <select id="p_status">
            <option>Active</option>
            <option>Paused</option>
            <option>Completed</option>
          </select>
        </div>
        <div class="form-row">
          <label>Funding %</label
          ><input id="p_funding" type="number" value="0" />
        </div>
        <div class="modal-actions">
          <button id="cancelProgram" class="btn ghost">Cancel</button>
          <button id="saveProgram" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/programs.js"></script>
  </body>
</html>
