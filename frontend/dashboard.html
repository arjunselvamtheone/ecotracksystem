<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTrack — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="page-dashboard">
  <header class="topbar">
    <h2>Welcome, <span id="username"></span></h2>
    <button id="logoutBtn" class="btn danger">Logout</button>
  </header>

  <main class="dashboard-container">
    <div class="stats">
      <div class="stat-card">Species <span id="cSpecies"></span></div>
      <div class="stat-card">Programs <span id="cPrograms"></span></div>
      <div class="stat-card">Incidents <span id="cIncidents"></span></div>
    </div>

    <div class="actions">
      <button id="btnNewAnimal" class="btn primary">Animals</button>
      <button id="btnNewProgram" class="btn primary">Programs</button>
      <button id="btnNewIncident" class="btn danger">Report Incident</button>
    </div>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
